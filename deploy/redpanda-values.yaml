# Redpanda Helm values for a 1-broker DEV cluster (SPEC-streaming.md Section 2).
# Used by:  helm install redpanda redpanda/redpanda -f deploy/redpanda-values.yaml
#
# Single broker, no TLS/SASL, small requests. Fits a 16 GB VM.
# Redpanda's built-in Schema Registry is enabled by default on the internal
# listener (port 8081); the control plane registers feed/feature/prediction
# schemas there via the Confluent-compatible REST API.
#
# VERIFY on first `make up`:
#   kubectl -n redpanda get svc
#   curl http://redpanda-0.redpanda.redpanda.svc.cluster.local:8081/subjects
statefulset:
  replicas: 1

resources:
  cpu:
    cores: 1
  memory:
    container:
      max: 2Gi
      min: 2Gi

# Dev single-node: no external listeners. Apps talk to the internal listener
# redpanda-0.redpanda.redpanda.svc.cluster.local:9093 (Kafka) / :8081 (schema registry).
tls:
  enabled: false

config:
  cluster:
    default_topic_replications: 1
  # Relaxes the low-memory / fsync guards for a laptop-class box.
  node:
    developer_mode: true

# Optional: browse topics + schemas in a web UI (port-forward 8080 -> console:8080).
# console:
#   enabled: true
